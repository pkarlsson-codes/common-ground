name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue. Use the private report link on the Security tab (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Include the page or screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in to the demo
        2. Open Today
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it
      options:
        - Live demo
        - Local install
        - Self-hosted server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Leave blank for the live demo.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, browser
      description: Do not paste real personal data about homeowners or applicants.
