executeActionsBodyHtml=<p>An administrator asked you to update your CommonGround account: {3}.</p><p style="margin:24px 0;"><a href="{0}" style="background:#bf832a;color:#0b1018;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:4px;display:inline-block;">Continue</a></p><p>The link works for {4}. If the button doesn''t work, paste this address into your browser:<br><span style="word-break:break-all;">{0}</span></p><p>If you weren''t expecting this, ignore this message. Nothing changes until the link is used.</p>
