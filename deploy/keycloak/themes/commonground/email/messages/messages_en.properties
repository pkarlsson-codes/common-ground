emailVerificationSubject=Confirm your email for CommonGround
emailVerificationBody=Someone used this email address to sign up for CommonGround. If that was you, confirm your email address with this link:\n\n{0}\n\nThe link works for {3}.\n\nIf you didn''t sign up, ignore this message. Nothing happens until the link is used.
emailVerificationBodyHtml=<p>Someone used this email address to sign up for CommonGround. If that was you, confirm your email address.</p><p style="margin:24px 0;"><a href="{0}" style="background:#bf832a;color:#0b1018;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:4px;display:inline-block;">Confirm email address</a></p><p>The link works for {3}. If the button doesn''t work, paste this address into your browser:<br><span style="word-break:break-all;">{0}</span></p><p>If you didn''t sign up, ignore this message. Nothing happens until the link is used.</p>
passwordResetSubject=Reset your CommonGround password
passwordResetBody=Someone asked to reset the password for your CommonGround account. If that was you, choose a new password with this link:\n\n{0}\n\nThe link works for {3}.\n\nIf you didn''t ask for this, ignore this message. Your password stays the same.
passwordResetBodyHtml=<p>Someone asked to reset the password for your CommonGround account. If that was you, choose a new password.</p><p style="margin:24px 0;"><a href="{0}" style="background:#bf832a;color:#0b1018;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:4px;display:inline-block;">Reset password</a></p><p>The link works for {3}. If the button doesn''t work, paste this address into your browser:<br><span style="word-break:break-all;">{0}</span></p><p>If you didn''t ask for this, ignore this message. Your password stays the same.</p>
