# Production stack on one server: Caddy, Postgres, Keycloak, API and management gateway.
# Run from this folder: docker compose up -d --build
# Settings come from deploy/.env (copy .env.example).
name: commonground

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - keycloak

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commonground
      POSTGRES_USER: commonground
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commonground -d commonground"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/commonground
      KC_DB_USERNAME: commonground
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      # Browsers use the public URL. The gateway calls Keycloak on the internal network
      # (http://keycloak:8080), and backchannel-dynamic makes Keycloak answer it with internal URLs.
      KC_HOSTNAME: https://${DOMAIN}/auth-server
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth-server
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Read by the realm file on its first import.
      DOMAIN: ${DOMAIN}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?set GATEWAY_CLIENT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CommonGround}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes/commonground:/opt/keycloak/themes/commonground:ro
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 serves health on the management port, 9000. The image has no curl.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth-server/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: src/CommonGround.API/Dockerfile
    image: commonground-api
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=commonground;Username=commonground;Password=${POSTGRES_PASSWORD}
      InternalJwt__SigningKey: ${INTERNAL_JWT_SIGNING_KEY:?set INTERNAL_JWT_SIGNING_KEY in .env}
      Demo__Enabled: ${DEMO_ENABLED:-false}
      Demo__SandboxDays: ${DEMO_SANDBOX_DAYS:-14}
      Demo__MaxSandboxes: ${DEMO_MAX_SANDBOXES:-100}
    volumes:
      - documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: src/CommonGround.Management.Gateway/Dockerfile
    image: commonground-gateway
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=commonground;Username=commonground;Password=${POSTGRES_PASSWORD}
      CorePlatform__BaseAddress: http://api:8080
      InternalJwt__SigningKey: ${INTERNAL_JWT_SIGNING_KEY}
      Authentication__OIDC__Authority: https://${DOMAIN}/auth-server/realms/commonground
      Authentication__OIDC__MetadataAddress: http://keycloak:8080/auth-server/realms/commonground/.well-known/openid-configuration
      Authentication__OIDC__ClientSecret: ${GATEWAY_CLIENT_SECRET}
      # Trust X-Forwarded-For and X-Forwarded-Proto from Caddy, so redirect URIs and cookies use https.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  documents:
