services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: commonground_postgres
    environment:
      POSTGRES_DB: commonground
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d commonground"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - commonground_network

  keycloak:
    # Same major version as deploy/compose.yml. 26 opens the registration form for prompt=create (the demo's "Try the demo").
    image: quay.io/keycloak/keycloak:26.4
    container_name: commonground_keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/commonground
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./config/keycloak/:/opt/keycloak/data/import/
    ports:
      - "7080:8080"
    healthcheck:
      # Keycloak 26 serves health on the management port, 9000.
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - commonground_network

  minio:
    image: minio/minio:latest
    container_name: commonground_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - commonground_network

  seq:
    image: datalust/seq
    container_name: commonground_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD:-admin}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - commonground_network

volumes:
  postgres_data:
  minio_data:
  seq_data:

networks:
  commonground_network:
    driver: bridge
